name: saarathi
description: Saarathi — compliance-native rides + delivery super app for Dang, Nepal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# One app, two modes (rider / driver). Nepal-first: offline-tolerant, cash-first,
# OSM/Valhalla maps (no Google), English + नेपाली. See ../docs/research/03-user-flows.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # Networking + secure token storage
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  web_socket_channel: ^3.0.1

  # Maps (self-hosted OSM/Valhalla tiles) + location
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # Platform integration
  app_links: ^7.2.1
  shared_preferences: ^2.3.3
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^7.3.1
  flutter_foreground_task: ^10.0.0

  # Realtime comms + safety + notifications
  flutter_webrtc: ^1.6.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^19.0.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # UI niceties
  google_fonts: ^8.2.1
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
