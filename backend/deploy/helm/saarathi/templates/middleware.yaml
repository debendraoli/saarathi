apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: {{ .Values.namespace }}
spec:
  headers:
    accessControlAllowOriginList: ["https://dashboard.{{ .Values.domain }}"]
    accessControlAllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    accessControlAllowHeaders: ["authorization", "content-type"]
    accessControlMaxAge: 3600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
  namespace: {{ .Values.namespace }}
spec:
  rateLimit:
    average: 100
    burst: 200
    period: 1s
