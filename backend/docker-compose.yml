# Local development infrastructure for the Saarathi backend.
# Postgres+PostGIS (relational + geospatial), Redis (geo/cache/queues), NATS
# JetStream (event bus). Data stays in-country in production; this is local only.

name: saarathi

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: saarathi
      POSTGRES_PASSWORD: saarathi_dev
      POSTGRES_DB: saarathi
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - ./.data/nats:/data
