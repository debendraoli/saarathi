# Local development infrastructure for the Saarathi backend.
# Postgres+PostGIS (relational + geospatial), Redis (geo/cache/queues), NATS
# JetStream (event bus). Data stays in-country in production; this is local only.

name: saarathi

# Shared config for the eight Rust services. Each is built from its own
# services/<name>/Dockerfile against the workspace root context, and reaches its
# dependencies by compose DNS name (postgres/redis/nats), not localhost.
x-svc-base: &svc-base
  restart: unless-stopped
  # Local dev only — a generous ceiling so a leak/runaway loop in one service
  # can't starve the others or the host, not a tuned production budget.
  # Third-party infra (postgres/redis/nats/valhalla/pelias/coturn) is
  # deliberately left unbounded here: their real footprints vary too much to
  # guess safely, and OOM-killing e.g. OpenSearch locally is worse than the
  # problem this is meant to catch.
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

x-svc-env: &svc-env
  DATABASE_URL: postgres://saarathi:saarathi_dev@postgres:5432/saarathi
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  # Every service verifies the same JWT — keep this identical across all of them.
  # Override in backend/.env (generate with: openssl rand -hex 32).
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-with-openssl-rand-hex-32}
  # Shared between rides (issuer of /v1/internal/*) and merchant (its only
  # caller) — never exposed via the gateway. Override in backend/.env.
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev-internal-secret-change-me}
  RUST_LOG: ${RUST_LOG:-info}

services:
  postgres:
    image: postgis/postgis:16-3.4
    # Default max_connections (100, or as low as 20 depending on how the
    # data volume was first initialized) is too small once every one of the
    # ~15 backend services holds its own connection pool — it's easy to
    # exhaust silently: queries just start failing with PoolTimedOut, and
    # any code that swallows DB errors (e.g. the dispatch background loop's
    # `.unwrap_or_default()`) goes quiet instead of erroring loudly.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: saarathi
      POSTGRES_PASSWORD: saarathi_dev
      POSTGRES_DB: saarathi
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - ./.data/nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API gateway — the single north-south front door. Mirrors production: k3s ships
  # Traefik as its default ingress, so the same router rules translate 1:1 to
  # Traefik IngressRoute CRDs (see deploy/k8s/ingressroute.yaml). Routes by path
  # to the service containers by name; `routing` (8084) stays internal to rides.
  # Gateway: http://localhost:8080   Dashboard: http://localhost:8090
  gateway:
    image: traefik:v3.1
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8090
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8080:8080"   # the gateway (all client traffic)
      - "8090:8090"   # Traefik dashboard (dev only)
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      # Reach services running on the host (cargo run); host-gateway on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth
      - rides
      - notify
      - payments
      - campaigns
      - partners

  # ── Rust services ───────────────────────────────────────────────────────────
  # Built from services/<name>/Dockerfile (context = this workspace root). The
  # first `up --build` compiles the shared dependencies once (cache mounts), then
  # each service's own crate. Ports are published so you can also hit a service
  # directly (e.g. curl localhost:8081/health) in addition to via the gateway.

  # Identity + KYC + location. Runs migrations and seeds a dev super-admin on boot.
  auth:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *svc-env
      PORT: 8081
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      # Local/CI traffic all arrives from one unpredictable Docker-bridge
      # address shared by every simulated user — exempt it from the OTP
      # token-bucket's IP layer (the phone layer still fully applies).
      # Never set this in a real deployment.
      OTP_RATE_LIMIT_IP_ALLOWLIST: ${OTP_RATE_LIMIT_IP_ALLOWLIST:-*}
      KYC_STORAGE_DIR: /data/kyc
      SEED_DEV_ADMIN_PHONE: ${SEED_DEV_ADMIN_PHONE:-+9779800000000}
    ports:
      - "8081:8081"
    volumes:
      - kyc-data:/data/kyc
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Trips, fare estimation, dispatch, realtime WS. Measures distance via routing.
  rides:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/rides/Dockerfile
    environment:
      <<: *svc-env
      RIDES_PORT: 8082
      ROUTING_SERVICE_URL: http://routing:8084
      MERCHANT_SERVICE_URL: http://merchant:8088
      GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io}
      # WebRTC ICE — set these in prod to your Coturn; blank = public STUN only.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_STUN_URL: ${TURN_STUN_URL:-stun:stun.l.google.com:19302}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      routing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # In-app inbox; consumes NotifyRequest off NATS (read-only if the bus is down).
  notify:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/notify/Dockerfile
    environment:
      <<: *svc-env
      NOTIFY_PORT: 8083
      # FCM push (optional): backend/secrets/fcm-service-account.json is bind-mounted
      # below, read-only; this points the sender at its in-container path.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-/secrets/fcm-service-account.json}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-saarathi-e6596}
      # SMS fallback for critical notifications push couldn't reach (optional,
      # same Sparrow account as auth's OTP fallback).
      SPARROW_SMS_TOKEN: ${SPARROW_SMS_TOKEN:-}
      SPARROW_SMS_FROM: ${SPARROW_SMS_FROM:-}
    volumes:
      - ./secrets/fcm-service-account.json:/secrets/fcm-service-account.json:ro
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Distance/duration engine (wraps Valhalla; haversine fallback). No database.
  # Internal dependency of rides — port is published for local health checks only.
  routing:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/routing/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      ROUTING_PORT: 8084
      ROUTING_ENGINE: ${ROUTING_ENGINE:-valhalla}
      # Blank = haversine fallback. To use the bundled engine (profile "routing"):
      #   ROUTING_URL=http://valhalla:8002
      ROUTING_URL: ${ROUTING_URL:-}
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Top-ups, payouts, PSP callbacks. Shares the DB with rides.
  payments:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      <<: *svc-env
      PAYMENTS_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Campaign management (staff CRUD + preview). Shares the DB with rides.
  campaigns:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/campaigns/Dockerfile
    environment:
      <<: *svc-env
      CAMPAIGNS_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Merchant/marketplace domain: merchants, menus, orders, delivery geofences.
  # Calls rides' internal API (never the gateway) to spawn the courier leg —
  # see services/rides/src/routes/internal.rs.
  merchant:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/merchant/Dockerfile
    environment:
      <<: *svc-env
      MERCHANT_PORT: 8088
      ROUTING_SERVICE_URL: http://routing:8084
      RIDES_SERVICE_URL: http://rides:8082
      MERCHANT_STORAGE_DIR: /data/merchant
      # Only reachable when the `routing` profile is also up — a best-effort
      # write, see saarathi_core::pelias_index; harmless if this host doesn't
      # resolve.
      PELIAS_ES_URL: http://pelias-opensearch:9200
    ports:
      - "8088:8088"
    volumes:
      - merchant-data:/data/merchant
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rides:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Community map contributions: submit → staff review → points/badges,
  # redeemable via rides' shared wallet tables (needs rides to have migrated
  # first, same as merchant/payments/campaigns already assume).
  places:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/places/Dockerfile
    environment:
      <<: *svc-env
      PLACES_PORT: 8089
      PLACES_STORAGE_DIR: /data/places
      # Only reachable when the `routing` profile is also up — a best-effort
      # write, see pelias_index.rs; harmless if this host doesn't resolve.
      PELIAS_ES_URL: http://pelias-opensearch:9200
    ports:
      - "8089:8089"
    volumes:
      - places-data:/data/places
    depends_on:
      postgres:
        condition: service_healthy
      rides:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8089/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Fleet/partner domain: roster, fleet money, dashboards, fleet campaigns.
  partners:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/partners/Dockerfile
    environment:
      <<: *svc-env
      PARTNERS_PORT: 8087
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Self-hosted Valhalla routing (OSM-based). On first boot it downloads the
  # configured OSM extract and builds tiles into ./.data/valhalla (this takes a
  # while); subsequent boots reuse the tiles. Point the rides service at it with
  # ROUTING_URL=http://localhost:8002 and ROUTING_ENGINE=valhalla.
  # Start it explicitly (it's in the "routing" profile so normal `up` skips it):
  #   docker compose --profile routing up -d valhalla
  #
  # Valhalla feature plugins enabled below (all built into the engine/image):
  #   • OpenStreetMapSpeeds default-speeds  → realistic speeds on untagged rural
  #     roads (the biggest quality win for Nepal's sparsely-tagged network).
  #   • Map-matching (/trace_route, /trace_attributes) → snap driver GPS traces
  #     onto the graph to derive frequently-used roads + observed speeds.
  #   • Live/predicted traffic archive (traffic.tar) → feed those observed speeds
  #     back so ETAs learn from real trips.
  #   • Tar-packed tiles → near-instant reboot AND horizontal scaling without k8s:
  #     build the tileset once, then run N read-only Valhalla replicas behind a
  #     load balancer off the same prebuilt tar (routes are read-only + cached in
  #     Redis by the rides service, so this scales cleanly).
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    profiles: ["routing"]
    # Unlike the Rust services (restart: unless-stopped via svc-base), this
    # was previously unrestarted — a crash or OOM left it dead until someone
    # noticed and ran `docker compose up -d` by hand. `routing`'s per-request
    # fallback to haversine masks this from users, but silently, so it can go
    # unnoticed for a long time.
    restart: unless-stopped
    ports:
      - "8002:8002"
    # Local dev ceiling, not a tuned production budget (current steady-state
    # usage on the Nepal/Lumbini extract is ~230MB; this leaves headroom for
    # a bigger extract or load spike while still turning a runaway into a
    # contained, auto-restarted container instead of a host-wide OOM risk).
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      # Nepal (Lumbini) OSM extract — swap for a wider region as coverage grows.
      tile_urls: "https://download.geofabrik.de/asia/nepal-latest.osm.pbf"
      # Build + serve concurrency. Raise on a bigger host for more parallel trips.
      server_threads: "4"
      use_tiles_ignore_pbf: "True"
      # Pack tiles into a tarball: instant graph load + shareable read-only tiles.
      build_tar: "True"
      # OpenStreetMapSpeeds plugin: fill speeds where rural OSM lacks maxspeed.
      use_default_speeds_config: "True"
      # Admin + timezone DBs: border/country rules + TIME-DEPENDENT routing
      # (hour-of-day), the prerequisite for predicted/historical traffic.
      build_admins: "True"
      build_time_zones: "True"
      # Elevation off: motorcycle/auto costing ignores grade (saves build + disk).
      # Flip to "True" if we add bicycle / on-foot delivery costing.
      build_elevation: "False"
      # Live/predicted traffic archive slot; populate from observed trip speeds.
      # Set to "" to disable. Map-matching needs no flag (built in).
      traffic_name: "traffic.tar"
    volumes:
      - ./.data/valhalla:/custom_files
    healthcheck:
      # wget isn't in this image; curl is.
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 20

  # Self-hosted map tiles — the app's raster TileLayer was silently falling
  # back to the public tile.openstreetmap.org (rate-limited, not meant for
  # app traffic — the persistent "blurry until it catches up" symptom
  # reported live was largely this, not just missing caching) because
  # nothing here ever actually built the "self-hosted tile server" the
  # client's SAARATHI_TILE_URL config comment already assumed existed.
  #
  # One-off build step (same Geofabrik extract Valhalla/Pelias already use):
  # renders it into a single vector tileset with Planetiler — minutes, not
  # the hours a classic osm2pgsql+mod_tile raster pipeline would take, and a
  # few hundred MB instead of that pipeline's 10-20GB PostGIS import.
  #   docker compose --profile routing run --rm tiles-build
  # Re-run whenever the extract should be refreshed; skipped automatically
  # on a normal `up` since it's a one-shot job, not a daemon.
  tiles-build:
    image: ghcr.io/onthegomap/planetiler:latest
    profiles: ["routing"]
    command:
      - --download
      - --area=nepal
      - --output=/data/nepal.mbtiles
    volumes:
      - ./.data/tiles:/data

  # Serves the tileset tiles-build produces, rasterizing vector → PNG on
  # request with its own on-disk render cache — the app's TileLayer needs no
  # changes at all, still just a plain {z}/{x}/{y}.png URL. Point the app at
  # it with --dart-define=SAARATHI_TILE_URL=http://<host>:8091/styles/basic-preview/{z}/{x}/{y}.png
  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    profiles: ["routing"]
    restart: unless-stopped
    # No `depends_on` on `tiles-build` deliberately — same reasoning as
    # Pelias's own one-off import steps just above: it's a manual, deliberate
    # "run once, then start the daemon" flow, not something `up` should
    # silently re-trigger (which a completion-based dependency would, since
    # `tiles-build` always re-downloads/rebuilds rather than skipping when
    # the mbtiles already exists).
    ports:
      - "8091:8080"
    # Explicit config + our own recolored style, not the plain `--mbtiles`
    # shorthand — that auto-picks tileserver-gl-styles' single bundled
    # "basic-preview" style, which is an explicitly-named dev preview (warm
    # khaki background/landuse, confirmed live as the muddy/brown look
    # reported on-device) rather than something meant to ship. Same style
    # *id* ("basic-preview") and data id ("v3") as that auto-generated
    # config, so the app's tile URL didn't need to change — only the
    # palette did. config.json/styles/ are tracked in git (small, hand-
    # authored); .data/tiles holds only the large generated mbtiles.
    command: ["-c", "/data/config.json"]
    volumes:
      - ./.data/tiles:/data
      - ./deploy/tileserver/config.json:/data/config.json:ro
      - ./deploy/tileserver/styles:/data/styles:ro
    deploy:
      resources:
        limits:
          memory: 1G

  # Self-hosted geocoder (replaces the public photon.komoot.io dependency).
  # Nepal-only data: same Geofabrik extract Valhalla uses, filtered
  # WhosOnFirst admin boundaries. Start with:  docker compose --profile routing up -d
  # pelias-opensearch pelias-api
  # then run the one-off imports (see scripts/, or docs/pelias-import.md):
  #   docker compose --profile routing run --rm pelias-import-openstreetmap
  #   docker compose --profile routing run --rm pelias-import-whosonfirst
  # Despite the service name (kept as-is so pelias.json's esclient host and
  # the other services' depends_on don't need to change), this actually runs
  # real Elasticsearch, not OpenSearch. OpenSearch — 1.x and 2.x both,
  # verified directly against both — reports its own independent version
  # number ("1.3.20", "2.19.6", ...) from its info endpoint, but Pelias's
  # schema tool hard-checks for an Elasticsearch version
  # (SUPPORTED_ES_VERSIONS = '>=7.4.2' in pelias/schema), which OpenSearch
  # can never satisfy regardless of which major version is pinned.
  pelias-opensearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    profiles: ["routing"]
    # Neither this nor pelias-api had a restart policy — both silently
    # exited (255, likely the disk-pressure episode earlier this session)
    # and stayed down for ~11h with nothing surfacing it until reverse-geocode
    # lookups started coming back empty and getting cached that way for 30
    # days (see routes::geo's fetch-failure-vs-empty-result fix).
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    # Pelias's schema requires the analysis-icu plugin, which the stock
    # image doesn't bundle — install it (idempotent: skipped once already
    # present in the persisted data/plugins volume) before handing off to
    # the image's normal entrypoint.
    entrypoint: >
      bash -c "
        bin/elasticsearch-plugin list | grep -q analysis-icu ||
        bin/elasticsearch-plugin install --batch analysis-icu;
        /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
      "
    ports:
      - "9200:9200"
    volumes:
      - ./.data/pelias-opensearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # One-off: creates the `pelias` index/mapping in OpenSearch. Must run
  # before any importer or the API — run with:
  #   docker compose --profile routing run --rm pelias-schema
  pelias-schema:
    image: pelias/schema:latest
    profiles: ["routing"]
    command: ["npm", "run", "create_index"]
    environment:
      PELIAS_CONFIG: /code/pelias.json
    volumes:
      - ./pelias.json:/code/pelias.json:ro
    depends_on:
      pelias-opensearch:
        condition: service_healthy

  pelias-api:
    image: pelias/api:latest
    profiles: ["routing"]
    restart: unless-stopped
    environment:
      PELIAS_CONFIG: /code/pelias.json
    # The image's own default listen port is 3100, regardless of pelias.json
    # `api.port` (confirmed via its own boot log: "pelias is now running on
    # http://:::3100") — map the host-debug port to that, not to 4000.
    ports:
      - "4000:3100"
    volumes:
      - ./pelias.json:/code/pelias.json:ro
    depends_on:
      pelias-opensearch:
        condition: service_healthy

  pelias-import-openstreetmap:
    image: pelias/openstreetmap:latest
    profiles: ["routing"]
    # The image's default CMD is a bare `/bin/bash` (meant for interactive
    # debugging) — without an explicit command, `docker compose run` under a
    # non-interactive shell just starts and exits immediately, importing
    # nothing. `npm start` is the image's own documented entrypoint.
    command: ["npm", "start"]
    environment:
      # Without this, pelias-config doesn't reliably find our mounted
      # pelias.json and silently falls back to its own hardcoded defaults
      # (a `/mnt/pelias/openstreetmap/planet-latest.osm.pbf` path that
      # doesn't exist in this container at all) instead of erroring loudly.
      PELIAS_CONFIG: /code/pelias.json
    volumes:
      - ./pelias.json:/code/pelias.json:ro
      - ./.data/pelias-import/openstreetmap:/data/openstreetmap
      # Needed for admin (country/region/locality) lookup during import —
      # same directory pelias-import-whosonfirst populates via
      # `imports.whosonfirst.datapath` in pelias.json.
      - ./.data/pelias-import/whosonfirst:/data/whosonfirst:ro
    depends_on:
      pelias-opensearch:
        condition: service_healthy

  pelias-import-whosonfirst:
    image: pelias/whosonfirst:latest
    profiles: ["routing"]
    command: ["npm", "start"]
    environment:
      PELIAS_CONFIG: /code/pelias.json
    volumes:
      - ./pelias.json:/code/pelias.json:ro
      - ./.data/pelias-import/whosonfirst:/data/whosonfirst
    depends_on:
      pelias-opensearch:
        condition: service_healthy

  # Self-hosted STUN/TURN (Coturn) for WebRTC peer-to-peer voice/video. Keeping
  # it in our infra means relay traffic + signaling stay in-country (golden rule:
  # data stays in Nepal), and we avoid per-minute third-party TURN costs. The
  # rides service mints short-lived credentials from TURN_SECRET via /v1/rtc/ice.
  # Start it explicitly:  docker compose --profile comms up -d coturn
  # PROD: set --external-ip to the public IP and open UDP 3478 + the relay range.
  # macOS Docker can't route the relay; local calls still work over STUN.
  coturn:
    image: coturn/coturn:4.6
    profiles: ["comms"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --realm=saarathi.np
      - --server-name=saarathi
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-dev-turn-secret-change-me}
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

# Named volumes so the non-root containers own their data dirs (bind mounts
# would be created root-owned and block writes).
volumes:
  kyc-data:
  places-data:
  merchant-data:
