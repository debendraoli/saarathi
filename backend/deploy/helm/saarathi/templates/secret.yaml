{{/*
Real values come from -f values-secret.yaml (gitignored, see
values-secret.example.yaml) or --set/--set-file at install time — never
committed. Every field defaults to "" so `helm lint`/`helm template` render
cleanly with no secrets supplied at all (this repo's static-only
verification pass, before a real cluster exists).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: saarathi-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "" | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | default "" | quote }}
  NATS_URL: {{ .Values.secrets.natsUrl | default "" | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "" | quote }}
  INTERNAL_SERVICE_SECRET: {{ .Values.secrets.internalServiceSecret | default "" | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "" | quote }}
  SPARROW_SMS_TOKEN: {{ .Values.secrets.sparrowSmsToken | default "" | quote }}
  SPARROW_SMS_FROM: {{ .Values.secrets.sparrowSmsFrom | default "" | quote }}
  TURN_SECRET: {{ .Values.secrets.turnSecret | default "" | quote }}
  FCM_SERVICE_ACCOUNT_JSON: {{ .Values.secrets.fcmServiceAccountJson | default "" | quote }}
