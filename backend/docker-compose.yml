# Local development infrastructure for the Saarathi backend.
# Postgres+PostGIS (relational + geospatial), Redis (geo/cache/queues), NATS
# JetStream (event bus). Data stays in-country in production; this is local only.

name: saarathi

# Shared config for the eight Rust services. Each is built from its own
# services/<name>/Dockerfile against the workspace root context, and reaches its
# dependencies by compose DNS name (postgres/redis/nats), not localhost.
x-svc-base: &svc-base
  restart: unless-stopped

x-svc-env: &svc-env
  DATABASE_URL: postgres://saarathi:saarathi_dev@postgres:5432/saarathi
  REDIS_URL: redis://redis:6379
  NATS_URL: nats://nats:4222
  # Every service verifies the same JWT — keep this identical across all of them.
  # Override in backend/.env (generate with: openssl rand -hex 32).
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-with-openssl-rand-hex-32}
  # Shared between rides (issuer of /v1/internal/*) and merchant (its only
  # caller) — never exposed via the gateway. Override in backend/.env.
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev-internal-secret-change-me}
  RUST_LOG: ${RUST_LOG:-info}

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: saarathi
      POSTGRES_PASSWORD: saarathi_dev
      POSTGRES_DB: saarathi
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - ./.data/nats:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API gateway — the single north-south front door. Mirrors production: k3s ships
  # Traefik as its default ingress, so the same router rules translate 1:1 to
  # Traefik IngressRoute CRDs (see deploy/k8s/ingressroute.yaml). Routes by path
  # to the service containers by name; `routing` (8084) stays internal to rides.
  # Gateway: http://localhost:8080   Dashboard: http://localhost:8090
  gateway:
    image: traefik:v3.1
    command:
      - --entrypoints.web.address=:8080
      - --entrypoints.traefik.address=:8090
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "8080:8080"   # the gateway (all client traffic)
      - "8090:8090"   # Traefik dashboard (dev only)
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    extra_hosts:
      # Reach services running on the host (cargo run); host-gateway on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      - auth
      - rides
      - notify
      - payments
      - campaigns
      - partners

  # ── Rust services ───────────────────────────────────────────────────────────
  # Built from services/<name>/Dockerfile (context = this workspace root). The
  # first `up --build` compiles the shared dependencies once (cache mounts), then
  # each service's own crate. Ports are published so you can also hit a service
  # directly (e.g. curl localhost:8081/health) in addition to via the gateway.

  # Identity + KYC + location. Runs migrations and seeds a dev super-admin on boot.
  auth:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *svc-env
      PORT: 8081
      OTP_DEV_MODE: ${OTP_DEV_MODE:-true}
      # Local/CI traffic all arrives from one unpredictable Docker-bridge
      # address shared by every simulated user — exempt it from the OTP
      # token-bucket's IP layer (the phone layer still fully applies).
      # Never set this in a real deployment.
      OTP_RATE_LIMIT_IP_ALLOWLIST: ${OTP_RATE_LIMIT_IP_ALLOWLIST:-*}
      KYC_STORAGE_DIR: /data/kyc
      SEED_DEV_ADMIN_PHONE: ${SEED_DEV_ADMIN_PHONE:-+9779800000000}
    ports:
      - "8081:8081"
    volumes:
      - kyc-data:/data/kyc
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Trips, fare estimation, dispatch, realtime WS. Measures distance via routing.
  rides:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/rides/Dockerfile
    environment:
      <<: *svc-env
      RIDES_PORT: 8082
      ROUTING_SERVICE_URL: http://routing:8084
      GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io}
      # WebRTC ICE — set these in prod to your Coturn; blank = public STUN only.
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_STUN_URL: ${TURN_STUN_URL:-stun:stun.l.google.com:19302}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      routing:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # In-app inbox; consumes NotifyRequest off NATS (read-only if the bus is down).
  notify:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/notify/Dockerfile
    environment:
      <<: *svc-env
      NOTIFY_PORT: 8083
      # FCM push (optional): mount the service-account JSON and point at it.
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      # SMS fallback for critical notifications push couldn't reach (optional,
      # same Sparrow account as auth's OTP fallback).
      SPARROW_SMS_TOKEN: ${SPARROW_SMS_TOKEN:-}
      SPARROW_SMS_FROM: ${SPARROW_SMS_FROM:-}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Distance/duration engine (wraps Valhalla; haversine fallback). No database.
  # Internal dependency of rides — port is published for local health checks only.
  routing:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/routing/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      ROUTING_PORT: 8084
      ROUTING_ENGINE: ${ROUTING_ENGINE:-valhalla}
      # Blank = haversine fallback. To use the bundled engine (profile "routing"):
      #   ROUTING_URL=http://valhalla:8002
      ROUTING_URL: ${ROUTING_URL:-}
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Top-ups, payouts, PSP callbacks. Shares the DB with rides.
  payments:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      <<: *svc-env
      PAYMENTS_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Campaign management (staff CRUD + preview). Shares the DB with rides.
  campaigns:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/campaigns/Dockerfile
    environment:
      <<: *svc-env
      CAMPAIGNS_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Merchant/marketplace domain: merchants, menus, orders, delivery geofences.
  # Calls rides' internal API (never the gateway) to spawn the courier leg —
  # see services/rides/src/routes/internal.rs.
  merchant:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/merchant/Dockerfile
    environment:
      <<: *svc-env
      MERCHANT_PORT: 8088
      ROUTING_SERVICE_URL: http://routing:8084
      RIDES_SERVICE_URL: http://rides:8082
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rides:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Fleet/partner domain: roster, fleet money, dashboards, fleet campaigns.
  partners:
    <<: *svc-base
    build:
      context: .
      dockerfile: services/partners/Dockerfile
    environment:
      <<: *svc-env
      PARTNERS_PORT: 8087
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Self-hosted Valhalla routing (OSM-based). On first boot it downloads the
  # configured OSM extract and builds tiles into ./.data/valhalla (this takes a
  # while); subsequent boots reuse the tiles. Point the rides service at it with
  # ROUTING_URL=http://localhost:8002 and ROUTING_ENGINE=valhalla.
  # Start it explicitly (it's in the "routing" profile so normal `up` skips it):
  #   docker compose --profile routing up -d valhalla
  #
  # Valhalla feature plugins enabled below (all built into the engine/image):
  #   • OpenStreetMapSpeeds default-speeds  → realistic speeds on untagged rural
  #     roads (the biggest quality win for Nepal's sparsely-tagged network).
  #   • Map-matching (/trace_route, /trace_attributes) → snap driver GPS traces
  #     onto the graph to derive frequently-used roads + observed speeds.
  #   • Live/predicted traffic archive (traffic.tar) → feed those observed speeds
  #     back so ETAs learn from real trips.
  #   • Tar-packed tiles → near-instant reboot AND horizontal scaling without k8s:
  #     build the tileset once, then run N read-only Valhalla replicas behind a
  #     load balancer off the same prebuilt tar (routes are read-only + cached in
  #     Redis by the rides service, so this scales cleanly).
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    profiles: ["routing"]
    ports:
      - "8002:8002"
    environment:
      # Nepal (Lumbini) OSM extract — swap for a wider region as coverage grows.
      tile_urls: "https://download.geofabrik.de/asia/nepal-latest.osm.pbf"
      # Build + serve concurrency. Raise on a bigger host for more parallel trips.
      server_threads: "4"
      use_tiles_ignore_pbf: "True"
      # Pack tiles into a tarball: instant graph load + shareable read-only tiles.
      build_tar: "True"
      # OpenStreetMapSpeeds plugin: fill speeds where rural OSM lacks maxspeed.
      use_default_speeds_config: "True"
      # Admin + timezone DBs: border/country rules + TIME-DEPENDENT routing
      # (hour-of-day), the prerequisite for predicted/historical traffic.
      build_admins: "True"
      build_time_zones: "True"
      # Elevation off: motorcycle/auto costing ignores grade (saves build + disk).
      # Flip to "True" if we add bicycle / on-foot delivery costing.
      build_elevation: "False"
      # Live/predicted traffic archive slot; populate from observed trip speeds.
      # Set to "" to disable. Map-matching needs no flag (built in).
      traffic_name: "traffic.tar"
    volumes:
      - ./.data/valhalla:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  # Self-hosted STUN/TURN (Coturn) for WebRTC peer-to-peer voice/video. Keeping
  # it in our infra means relay traffic + signaling stay in-country (golden rule:
  # data stays in Nepal), and we avoid per-minute third-party TURN costs. The
  # rides service mints short-lived credentials from TURN_SECRET via /v1/rtc/ice.
  # Start it explicitly:  docker compose --profile comms up -d coturn
  # PROD: set --external-ip to the public IP and open UDP 3478 + the relay range.
  # macOS Docker can't route the relay; local calls still work over STUN.
  coturn:
    image: coturn/coturn:4.6
    profiles: ["comms"]
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --realm=saarathi.np
      - --server-name=saarathi
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-dev-turn-secret-change-me}
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

# Named volume for KYC documents so the non-root auth container owns the dir
# (bind mounts would be created root-owned and block writes).
volumes:
  kyc-data:
