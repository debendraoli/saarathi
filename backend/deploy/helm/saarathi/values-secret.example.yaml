# Documents the shape of the real secret values this chart needs. Copy this
# to a gitignored values-secret.yaml and fill in real values for a local
# `helm install -f values-secret.yaml`, or supply the same keys via CI's
# --set/--set-file flags (see app/RELEASE.md-style secrets table in
# backend/deploy/helm/saarathi/README or the deploy workflow itself).
#
# NEVER commit a filled-in copy of this file under any name.

secrets:
  # Full Postgres connection string INCLUDING the password — that password
  # must match postgresPassword below, they're supplied independently but
  # have to agree or the postgres StatefulSet and every service's
  # DATABASE_URL disagree about the login.
  databaseUrl: postgres://saarathi:CHANGE_ME@postgres:5432/saarathi
  postgresPassword: CHANGE_ME

  redisUrl: redis://redis:6379
  natsUrl: nats://nats:4222

  # openssl rand -hex 32
  jwtSecret: CHANGE_ME
  internalServiceSecret: CHANGE_ME

  # Optional — blank disables the SMS fallback / TURN ICE creds respectively.
  sparrowSmsToken: ""
  sparrowSmsFrom: ""
  turnSecret: ""

  # The FCM service-account JSON's file *content* — pass via
  # `--set-file secrets.fcmServiceAccountJson=backend/secrets/fcm-service-account.json`
  # rather than pasting it inline here.
  fcmServiceAccountJson: ""
