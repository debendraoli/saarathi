{{/*
Single-node, security disabled — internal-only ClusterIP, never exposed.
Despite the resource name, this is real Elasticsearch 7.17 (see values.yaml
`pelias.opensearch.image` for why — OpenSearch's own version numbering fails
Pelias's hard-coded Elasticsearch version check no matter which major
version is pinned). The entrypoint override installs the analysis-icu
plugin, which Pelias's schema requires and the stock image doesn't bundle,
before handing off to the image's normal startup.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pelias-opensearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-opensearch" "Release" .Release) | nindent 4 }}
spec:
  serviceName: pelias-opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pelias-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pelias-opensearch
    spec:
      containers:
        - name: opensearch
          image: {{ .Values.pelias.opensearch.image }}
          command: ["bash", "-c"]
          args:
            - |
              bin/elasticsearch-plugin list | grep -q analysis-icu ||
              bin/elasticsearch-plugin install --batch analysis-icu
              /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: {{ .Values.pelias.opensearch.javaOpts | quote }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.pelias.opensearch.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.pelias.opensearch.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: pelias-opensearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-opensearch" "Release" .Release) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pelias-opensearch
  ports:
    - port: 9200
      targetPort: 9200
  clusterIP: None
