apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "dashboard" "Release" .Release) | nindent 4 }}
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`dashboard.{{ .Values.domain }}`)
      services:
        - name: dashboard
          port: 80
  tls:
    secretName: saarathi-dashboard-tls
