{{/*
Vector-tile + glyph server for the app's MapView (martinBaseUrl in
app_config.dart). Reads the same mbtiles PVC tiles-build-job.yaml produces
and tileserver-gl-deployment.yaml also reads (mounted read-only here, like
docker-compose's `:ro`). No IngressRoute of its own — reached at
api.<domain>/tiles/... via the "tiles-stripprefix" + "tiles-ratelimit"
middlewares in middleware.yaml, alongside the other services' IngressRoutes
in services.yaml, so it gets the same TLS termination and no bare port
facing the internet (see the martinBaseUrl migration this was ported from).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: martin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "martin" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.martin.hpa.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: martin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: martin
    spec:
      containers:
        - name: martin
          image: {{ .Values.martin.image }}
          # The specific .mbtiles file, not the whole /data directory — see
          # the docker-compose martin service comment this was ported from:
          # pointing at the directory made Martin auto-scan every file in it
          # for tile sources, including tileserver-gl's own config.json,
          # which it failed to parse as GeoJSON — fatal on every startup, so
          # the pod just crash-looped.
          args: ["/data/nepal.mbtiles", "--font", "/fonts"]
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /catalog, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /catalog, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: fonts
              mountPath: /fonts
              readOnly: true
          resources:
            {{- toYaml .Values.martin.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tiles-data
        - name: fonts
          configMap:
            name: martin-fonts
---
apiVersion: v1
kind: Service
metadata:
  name: martin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "martin" "Release" .Release) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: martin
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: martin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "martin" "Release" .Release) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: martin
  minReplicas: {{ .Values.martin.hpa.minReplicas }}
  maxReplicas: {{ .Values.martin.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.martin.hpa.targetCPUUtilization }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: martin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "martin" "Release" .Release) | nindent 4 }}
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      middlewares:
        - name: tiles-stripprefix
        - name: tiles-ratelimit
      match: Host(`api.{{ .Values.domain }}`) && PathPrefix(`/tiles`)
      services:
        - name: martin
          port: 80
  tls:
    secretName: saarathi-api-tls
