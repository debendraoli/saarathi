name: saarathi
description: Saarathi — compliance-native rides + delivery super app for Dang, Nepal.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

# One app, two modes (rider / driver). Nepal-first: offline-tolerant, cash-first,
# OSM/Valhalla maps (no Google), English + नेपाली. See ../docs/research/03-user-flows.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^2.6.1
  go_router: ^17.3.0

  # Networking + secure token storage
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1
  web_socket_channel: ^3.0.1

  # Maps (self-hosted OSM/Valhalla tiles) + location
  flutter_map: ^8.3.1
  # Already pulled in transitively by flutter_map (its NetworkTileProvider's
  # default RetryClient) — declared directly so map_view.dart can configure
  # a more patient retry policy for tile fetches over an unreliable mobile
  # connection instead of the default's ~2.4s/503-only retry.
  http: ^1.6.0
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  location: ^10.0.2
  # Device compass (magnetometer) — GPS course-over-ground is unreliable
  # below walking speed, so the nav camera/vehicle icon blends in compass
  # heading while stopped/crawling instead of freezing on stale GPS heading.
  flutter_compass: ^0.8.1

  # Platform integration
  app_links: ^7.2.1
  shared_preferences: ^2.3.3
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  image_picker: ^1.1.2
  # Pinned ≤12: permission_handler_android 14.0.0's Java source references
  # Manifest.permission.ACCESS_LOCAL_NETWORK and
  # Build.VERSION_CODES.CINNAMON_BUN — constants that don't exist even at
  # compileSdk 37 (confirmed via a real `flutter build apk --release`
  # failure on 2026-08-25: "cannot find symbol", 4 errors in
  # PermissionUtils.java). These look like a newer/preview SDK's API
  # surface, not 37's. The previous pin comment here blamed a stale
  # "compileSdk 37 is a preview SDK" claim and l8DexDesugarLibRelease —
  # that reasoning was wrong (API 37/Android 17 has been stable since June
  # 2026, and the real blocker for compileSdk 37 itself was AGP <9.1.1,
  # already fixed by the AGP 9.3.0 bump above) — but 11.x is still the
  # correct pin today, just for this different, verified reason. Revisit
  # permission_handler 13.x once a version ships that doesn't reference
  # unreleased SDK constants.
  permission_handler: ^11.4.0
  connectivity_plus: ^7.3.1
  flutter_foreground_task: ^11.0.1

  # Realtime comms + safety + notifications
  flutter_webrtc: ^1.6.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  # UI niceties
  google_fonts: ^8.2.1
  intl: any
  cupertino_icons: ^1.0.8
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^3.1.3
  receive_sharing_intent: ^1.9.0
  cached_network_image: ^3.4.1
  flutter_contacts: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

# Regenerate after changing the source image: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  # White, matching the flat icon's own background — the source logo has a
  # lot of transparent padding around it, so a dark fill here (tried #1A1200
  # first) reads as a heavy dark border once composited. The foreground is a
  # separate, more tightly-cropped transparent-background render so it
  # survives the OS's circle/squircle mask without the logo getting clipped.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  # ios/ isn't generated in this checkout yet (see README's first-time setup);
  # flip this to true and rerun once it exists — flutter_launcher_icons can't
  # write into a platform folder that isn't there.
  ios: false
  remove_alpha_ios: true

# Native (OS-level) boot splash — the ONLY splash screen in the app; the old
# hand-rolled animated logo widget (onboarding/presentation/splash_screen.dart)
# has been retired so there's no second, different-looking screen after this
# one dismisses. Pre-Android-12 devices get the free-form legacy drawable, so
# the full "SAARATHI" wordmark lockup shows unclipped there. Android 12+'s own
# SplashScreen API constrains the *icon* to a fixed safe zone — feeding it the
# full wordmark is what clipped it into unreadable text before — so there the
# icon is plain, and the wordmark instead runs through the API's dedicated
# branding-image slot (added by hand below; flutter_native_splash doesn't
# generate that part for Android 12+, only for older platforms).
# Regenerate after changing the icon: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/images/app_icon_foreground.png
    image_dark: assets/images/app_icon_foreground.png
  android: true
  ios: false
  web: false
