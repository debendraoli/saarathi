{{/* Internal-only — no IngressRoute, called only by saarathi-rides. Its Service ("pelias-api") is defined alongside the shared config in pelias-config-configmap.yaml. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pelias-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-api" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.pelias.api.hpa.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pelias-api
  template:
    metadata:
      labels:
        {{- include "saarathi.componentLabels" (dict "component" "pelias-api" "Release" .Release) | nindent 8 }}
    spec:
      containers:
        - name: pelias-api
          image: {{ .Values.pelias.api.image }}
          env:
            # Without this, pelias-config doesn't reliably find the mounted
            # pelias.json and falls back to hardcoded defaults instead.
            - name: PELIAS_CONFIG
              value: /code/pelias.json
          ports:
            # 3100, not pelias.json's `api.port: 4000` — see the Service
            # definition in pelias-config-configmap.yaml for why.
            - containerPort: 3100
          readinessProbe:
            httpGet: { path: /v1/status, port: 3100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/status, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /code/pelias.json
              subPath: pelias.json
          resources:
            {{- toYaml .Values.pelias.api.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: pelias-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pelias-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-api" "Release" .Release) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pelias-api
  minReplicas: {{ .Values.pelias.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.pelias.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.pelias.api.hpa.targetCPUUtilization }}
