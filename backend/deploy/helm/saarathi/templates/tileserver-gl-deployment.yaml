{{/*
Serves the tileset tiles-build-job.yaml produces, rasterizing vector → PNG
on request with its own on-disk render cache — reads the same PVC that Job
writes to (run once, before this rolls out; see that file's header).
Publicly exposed (own subdomain, like dashboard) since the app fetches
tiles directly: point SAARATHI_TILE_URL at
https://tiles.<domain>/styles/basic-preview/{z}/{x}/{y}.png ("basic-preview"
confirmed live — tileserver-gl auto-generates this style id from the
mbtiles when no config.json is supplied; re-check via the root URL if it's
ever regenerated with a custom config).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tileserver-gl
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "tileserver-gl" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.tiles.server.hpa.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tileserver-gl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tileserver-gl
    spec:
      containers:
        - name: tileserver-gl
          image: {{ .Values.tiles.server.image }}
          args: ["--mbtiles", "/data/nepal.mbtiles"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.tiles.server.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tiles-data
---
apiVersion: v1
kind: Service
metadata:
  name: tileserver-gl
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "tileserver-gl" "Release" .Release) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tileserver-gl
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tileserver-gl
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "tileserver-gl" "Release" .Release) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tileserver-gl
  minReplicas: {{ .Values.tiles.server.hpa.minReplicas }}
  maxReplicas: {{ .Values.tiles.server.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tiles.server.hpa.targetCPUUtilization }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tileserver-gl
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "tileserver-gl" "Release" .Release) | nindent 4 }}
spec:
  entryPoints: ["websecure"]
  routes:
    - kind: Rule
      match: Host(`tiles.{{ .Values.domain }}`)
      services:
        - name: tileserver-gl
          port: 80
  tls:
    secretName: saarathi-tiles-tls
