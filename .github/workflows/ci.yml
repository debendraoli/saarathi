name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo test --workspace

  app:
    name: App (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  dashboard:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    name: Integration smoke (live PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: saarathi
          POSTGRES_PASSWORD: saarathi_dev
          POSTGRES_DB: saarathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saarathi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://saarathi:saarathi_dev@localhost:5432/saarathi
      JWT_SECRET: ci-test-secret-not-for-production-use-only
      OTP_DEV_MODE: "true"
      SEED_DEV_ADMIN_PHONE: "+9779800000000"
      PORT: "8081"
      RIDES_PORT: "8082"
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build services
        working-directory: backend
        run: cargo build -p saarathi-auth -p saarathi-rides
      - name: Start auth
        working-directory: backend
        run: |
          cargo run -q -p saarathi-auth &
          for i in $(seq 1 60); do curl -fsS localhost:8081/health && break; sleep 1; done
      - name: Start rides
        working-directory: backend
        run: |
          cargo run -q -p saarathi-rides &
          for i in $(seq 1 60); do curl -fsS localhost:8082/health && break; sleep 1; done
      - name: Smoke test
        run: bash scripts/smoke.sh
