{{/*
One-off: builds the vector tileset martin serves from the shared OSM
extract fetch-osm-job.yaml downloads — a few hundred MB, minutes to build
(not the hours a classic osm2pgsql+mod_tile raster pipeline would take).
Not triggered automatically by `helm upgrade`, same reasoning as the Pelias
import Jobs (slow, shouldn't block/re-run on every deploy) — run fetch-osm
first, then this, once, after the first install:

  kubectl apply -f <(helm template saarathi backend/deploy/helm/saarathi -s templates/tiles-build-job.yaml)
  kubectl -n saarathi wait --for=condition=complete job/tiles-build --timeout=20m

Then roll out martin (martin-deployment.yaml) — it reads the same PVC this
Job writes to. Re-running later (e.g. to refresh with newer OSM data) means
deleting the old Job first — Jobs are immutable once created:

  kubectl -n saarathi delete job tiles-build
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiles-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "tiles" "Release" .Release) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.tiles.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tiles-build
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "tiles" "Release" .Release) | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tiles-build
    spec:
      restartPolicy: Never
      containers:
        - name: tiles-build
          image: {{ .Values.tiles.build.image }}
          # --osm-path, not --download --area=nepal — reads the shared
          # extract fetch-osm-job.yaml already downloaded instead of
          # Planetiler fetching its own separate copy.
          args:
            - --osm-path=/osm-data/nepal-latest.osm.pbf
            - --output=/data/nepal.mbtiles
          volumeMounts:
            - name: data
              mountPath: /data
            - name: osm-data
              mountPath: /osm-data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tiles-data
        - name: osm-data
          persistentVolumeClaim:
            claimName: osm-data
