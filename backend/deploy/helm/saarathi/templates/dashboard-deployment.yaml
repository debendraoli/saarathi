apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "dashboard" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.hpa.minReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      containers:
        - name: dashboard
          # NEXT_PUBLIC_API_BASE is baked in at image build time (see
          # dashboard/Dockerfile) — not settable here as a runtime env var.
          image: {{ .Values.image.registry }}/saarathi-dashboard:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "dashboard" "Release" .Release) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - port: 80
      targetPort: 3000
