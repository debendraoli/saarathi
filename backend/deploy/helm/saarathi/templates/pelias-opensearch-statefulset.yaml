{{/* Single-node, security plugin disabled — internal-only ClusterIP, never exposed. */}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pelias-opensearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-opensearch" "Release" .Release) | nindent 4 }}
spec:
  serviceName: pelias-opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pelias-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pelias-opensearch
    spec:
      containers:
        - name: opensearch
          image: {{ .Values.pelias.opensearch.image }}
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: {{ .Values.pelias.opensearch.javaOpts | quote }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          resources:
            {{- toYaml .Values.pelias.opensearch.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.pelias.opensearch.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: pelias-opensearch
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-opensearch" "Release" .Release) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pelias-opensearch
  ports:
    - port: 9200
      targetPort: 9200
  clusterIP: None
