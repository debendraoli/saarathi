# Traefik dynamic configuration — the API gateway route table.
#
# One north-south front door: routes each request by path to the owning service.
# `routing` (8084) is intentionally absent — it's an internal, service-to-service
# dependency of rides and must not be publicly reachable. Prefixes that are split
# across services (/v1/admin/*, /v1/driver/*) are disambiguated by enumerating the
# specific sub-paths, so every rule maps to exactly one service.
#
# This mirrors the production k3s ingress (Traefik) — see deploy/k8s/ingressroute.yaml.

http:
  routers:
    auth:
      entryPoints: ["web"]
      service: auth
      middlewares: ["cors", "ratelimit"]
      # `/v1/me` is Path + PathPrefix(`/v1/me/`), not a bare PathPrefix(`/v1/me`) —
      # that would also literal-string-match `/v1/merchant*` (PathPrefix has no
      # path-segment awareness) and, being the longer/higher-priority rule, steal
      # every merchant-service request out from under the merchant router.
      rule: >-
        PathPrefix(`/v1/auth`) || Path(`/v1/me`) || PathPrefix(`/v1/me/`)
        || PathPrefix(`/v1/driver/register`) || PathPrefix(`/v1/driver/documents`) || PathPrefix(`/v1/driver/status`)
        || PathPrefix(`/v1/driver/kyc`)
        || PathRegexp(`^/v1/driver/[0-9a-fA-F-]+/photo$`)
        || PathPrefix(`/v1/admin/drivers`) || PathPrefix(`/v1/admin/documents`)
        || PathPrefix(`/v1/admin/staff`)

    rides:
      entryPoints: ["web"]
      service: rides
      middlewares: ["cors", "ratelimit"]
      rule: >-
        PathPrefix(`/v1/rides`) || PathPrefix(`/v1/delivery`) || PathPrefix(`/v1/wallet`)
        || PathPrefix(`/v1/rtc`)
        || PathPrefix(`/v1/geo`)
        || PathPrefix(`/v1/ws`) || PathPrefix(`/v1/events`) || PathPrefix(`/v1/flags`)
        || PathPrefix(`/v1/reports`) || PathPrefix(`/v1/credit-plans`) || PathPrefix(`/v1/drivers`)
        || PathPrefix(`/v1/driver/analytics`) || PathPrefix(`/v1/driver/credits`)
        || PathPrefix(`/v1/driver/heartbeat`) || PathPrefix(`/v1/driver/offers`)
        || PathPrefix(`/v1/driver/offline`) || PathPrefix(`/v1/driver/online`)
        || PathPrefix(`/v1/admin/analytics`) || PathPrefix(`/v1/admin/cancellations`)
        || PathPrefix(`/v1/admin/credit-plans`) || PathPrefix(`/v1/admin/flags`)
        || PathPrefix(`/v1/admin/leaderboard`) || PathPrefix(`/v1/admin/ledger`)
        || PathPrefix(`/v1/admin/riders`) || PathPrefix(`/v1/admin/driver-analytics`)
        || PathPrefix(`/v1/admin/driver-directory`)
        || PathPrefix(`/v1/admin/reports`) || PathPrefix(`/v1/admin/rides`)
        || PathPrefix(`/v1/admin/sos`)
        || PathPrefix(`/v1/admin/surge`) || PathPrefix(`/v1/admin/trips`)

    notify:
      entryPoints: ["web"]
      service: notify
      middlewares: ["cors", "ratelimit"]
      rule: PathPrefix(`/v1/notifications`)

    payments:
      entryPoints: ["web"]
      service: payments
      middlewares: ["cors", "ratelimit"]
      rule: >-
        PathPrefix(`/v1/credits`) || PathPrefix(`/v1/payouts`) || PathPrefix(`/v1/psp`)
        || PathPrefix(`/v1/payout-accounts`) || PathPrefix(`/v1/disputes`)
        || PathPrefix(`/v1/payments`)
        || PathPrefix(`/v1/admin/payouts`) || PathPrefix(`/v1/admin/disputes`)
        || PathPrefix(`/v1/admin/credits`)

    campaigns:
      entryPoints: ["web"]
      service: campaigns
      middlewares: ["cors", "ratelimit"]
      rule: PathPrefix(`/v1/campaigns`) || PathPrefix(`/v1/admin/campaigns`)

    merchant:
      entryPoints: ["web"]
      service: merchant
      middlewares: ["cors", "ratelimit"]
      rule: >-
        PathPrefix(`/v1/merchants`) || PathPrefix(`/v1/orders`)
        || PathPrefix(`/v1/merchant`) || PathPrefix(`/v1/admin/merchants`)
        || PathPrefix(`/v1/items`)

    partners:
      entryPoints: ["web"]
      service: partners
      middlewares: ["cors", "ratelimit"]
      rule: PathPrefix(`/v1/partner`) || PathPrefix(`/v1/admin/partners`)

    places:
      entryPoints: ["web"]
      service: places
      middlewares: ["cors", "ratelimit"]
      rule: PathPrefix(`/v1/places`) || PathPrefix(`/v1/admin/places`)

    # Health aggregation for the ops dashboard: /status/<svc> → that service's
    # /health (routing included for visibility, though its API stays internal).
    health-auth:
      entryPoints: ["web"]
      service: auth
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/auth`)
    health-rides:
      entryPoints: ["web"]
      service: rides
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/rides`)
    health-notify:
      entryPoints: ["web"]
      service: notify
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/notify`)
    health-routing:
      entryPoints: ["web"]
      service: routing
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/routing`)
    health-payments:
      entryPoints: ["web"]
      service: payments
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/payments`)
    health-campaigns:
      entryPoints: ["web"]
      service: campaigns
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/campaigns`)
    health-merchant:
      entryPoints: ["web"]
      service: merchant
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/merchant`)
    health-partners:
      entryPoints: ["web"]
      service: partners
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/partners`)
    health-places:
      entryPoints: ["web"]
      service: places
      middlewares: ["cors", "health-rewrite"]
      rule: Path(`/status/places`)

  middlewares:
    # Rewrite /status/<svc> to /health before forwarding to the service.
    health-rewrite:
      replacePath:
        path: /health
    # CORS lives here now, not in each service. Allow the dashboard origin.
    cors:
      headers:
        # Also allow the LAN address so the dashboard works when opened via
        # its printed "Network" URL (e.g. from a phone/tablet on the same
        # Wi-Fi) instead of localhost. Update the IP if your machine's changes.
        accessControlAllowOriginList: ["http://localhost:3000", "http://192.168.1.66:3000"]
        accessControlAllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
        accessControlAllowHeaders: ["authorization", "content-type", "x-idempotency-key"]
        accessControlMaxAge: 3600
        addVaryHeader: true
    # Coarse per-source-IP DoS protection (domain throttles, e.g. per-phone OTP,
    # stay in the services). Generous so normal bursts pass.
    ratelimit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s

  services:
    auth:
      loadBalancer:
        servers:
          - url: http://auth:8081
    rides:
      loadBalancer:
        servers:
          - url: http://rides:8082
    notify:
      loadBalancer:
        servers:
          - url: http://notify:8083
    payments:
      loadBalancer:
        servers:
          - url: http://payments:8085
    campaigns:
      loadBalancer:
        servers:
          - url: http://campaigns:8086
    merchant:
      loadBalancer:
        servers:
          - url: http://merchant:8088
    partners:
      loadBalancer:
        servers:
          - url: http://partners:8087
    places:
      loadBalancer:
        servers:
          - url: http://places:8089
    # Referenced only by the /status/routing health router — routing's API
    # (/v1/route) is never exposed publicly.
    routing:
      loadBalancer:
        servers:
          - url: http://routing:8084
