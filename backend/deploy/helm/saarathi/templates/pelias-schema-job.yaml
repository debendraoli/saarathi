{{/*
One-off: creates the `pelias` index/mapping in Elasticsearch. Must run
successfully before either import Job or pelias-api will ever return
results — without it, imports fail with "index pelias does not exist" and
the API fails with "no hits for aggregation". See README's "Pelias
bootstrap" section for the full sequence.
  kubectl apply -f <(helm template saarathi backend/deploy/helm/saarathi -s templates/pelias-schema-job.yaml)
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: pelias-schema
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "saarathi.componentLabels" (dict "component" "pelias-schema" "Release" .Release) | nindent 4 }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pelias-schema
    spec:
      restartPolicy: Never
      containers:
        - name: schema
          image: {{ .Values.pelias.schema.image }}
          command: ["npm", "run", "create_index"]
          env:
            - name: PELIAS_CONFIG
              value: /code/pelias.json
          volumeMounts:
            - name: config
              mountPath: /code/pelias.json
              subPath: pelias.json
      volumes:
        - name: config
          configMap:
            name: pelias-config
