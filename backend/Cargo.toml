[workspace]
resolver = "2"
members = [
    "crates/saarathi-core",
    "services/auth",
    "services/rides",
    "services/notify",
    "services/routing",
    "services/payments",
    "services/campaigns",
    "services/partners",
    "services/merchant",
    "services/places",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
authors = ["Debendra Oli"]
rust-version = "1.97"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "rust_decimal", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query", "form"] }
futures-util = "0.3"
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
async-nats = "0.50"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = "0.5"
rand = "0.10"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
async-trait = "0.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "catch-panic"] }
h3o = { version = "0.10", features = ["geo"] }
# Must match the `geo` version h3o's own Cargo.toml depends on (currently
# 0.33) — Cargo won't unify our direct dep with h3o's if they diverge, and
# `geo::Polygon` values then wouldn't type-match what `h3o::geom` expects.
geo = "0.33"

# internal
saarathi-core = { path = "crates/saarathi-core" }

[profile.release]
lto = "thin"
codegen-units = 1
